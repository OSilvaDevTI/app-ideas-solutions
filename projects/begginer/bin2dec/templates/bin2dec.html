<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin2Dec</title>
</head>
<body>
    <h1>Conversor de Binário para Decimal</h1>
    <form method="post">
        <label for="binario">Número binário:</label>
        <input type="text" id="binario" name="binario" pattern="[01]+" required>
        <button type="submit">Converter</button>
    </form>
    <p>Resultado: {{ result }}</p>
</body>
</html>
